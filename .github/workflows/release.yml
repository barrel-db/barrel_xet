name: Release

# Publishes on a v* tag: a per-platform prod tarball attached to the GitHub
# release, and a container image on GHCR (semver + latest tags). Both are
# smoke-tested before anything is published. workflow_dispatch runs the same
# build and smoke without publishing, for dry runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tarball:
    name: release tarball
    runs-on: ubuntu-24.04
    # A cold prod build recompiles rocksdb from source (~15 min).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps for NIFs (rocksdb, blake3, lz4)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential curl liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev libbz2-dev
      - name: Build prod tarball
        run: rebar3 as prod tar
      - name: Stage platform-named artifact
        run: |
          src=$(ls _build/prod/rel/barrel_xet/barrel_xet-*.tar.gz)
          ref="${GITHUB_REF_NAME:-dev}"
          out="barrel_xet-${ref}-linux-amd64.tar.gz"
          cp "$src" "$out"
          echo "artifact=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: ${{ env.artifact }}
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ env.artifact }}" --clobber

  image:
    name: GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Build single-arch amd64 and load into the local daemon so the image
      # is smoke-tested before it is pushed. Multi-arch is deferred.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: barrel_xet:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name bx -p 8080:8080 barrel_xet:smoke
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz 2>/dev/null) && [ "$code" = 200 ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
          docker exec bx /opt/barrel_xet/bin/barrel_xet eval 'true = true.'
          docker rm -f bx
      # The push reuses the gha cache from the build above, so it is fast.
      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
