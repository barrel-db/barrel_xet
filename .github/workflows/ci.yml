name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - run: make fmt-check

  xref:
    name: xref
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps for NIFs (instrument, rocksdb, blake3, lz4)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev libbz2-dev
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: make xref

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps for NIFs (instrument, rocksdb, blake3, lz4)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev libbz2-dev
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: make lint

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps for NIFs (instrument, rocksdb, blake3, lz4)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev libbz2-dev
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - name: Cache Dialyzer PLT
        uses: actions/cache@v5
        with:
          path: |
            _build/default/*_plt
            ~/.cache/rebar3/rebar3_*_plt
          key: plt-otp-29-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: plt-otp-29-
      - run: make dialyzer

  test:
    name: test (eunit + proper + ct)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps for NIFs (instrument, rocksdb, blake3, lz4)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev libbz2-dev
      # The vendored Python reference client needs 3.14+ (deferred
      # annotation evaluation); on 3.12/3.13 it raises at import time.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Python reference client (cross-impl e2e)
        run: python3 -m pip install --quiet blake3 lz4 requests || true
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config', 'rebar.lock') }}
      # Large-fixture and Garage groups self-skip; the python cross-impl
      # cases run when the deps installed above are present.
      - run: make test

  release:
    name: release cold-start smoke
    needs: [format, xref, lint, dialyzer, test]
    runs-on: ubuntu-24.04
    # A cold prod build recompiles rocksdb from source (~15 min); the cache
    # below makes warm runs a couple of minutes. The timeout turns a genuine
    # hang into a fast failure instead of a 6-hour "in progress".
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential curl liblz4-dev libsnappy-dev libzstd-dev zlib1g-dev libbz2-dev
      # Cache the prod build so `make smoke` reuses the compiled deps
      # (rocksdb above all). restore-keys keeps a warm _build/prod even when
      # rebar.config changes but the pinned deps do not.
      - uses: actions/cache@v5
        with:
          path: |
            _build/prod
            ~/.cache/rebar3
          key: build-prod-otp-29-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: build-prod-otp-29-
      - run: make smoke
